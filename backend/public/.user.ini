; Per-directory PHP config for the Parfum backend.
; PHP 8.x JIT generates AVX2/AVX512 instructions that crash on some CPUs
; (Windows STATUS_ILLEGAL_INSTRUCTION / exit code 3221225725).
; Disabling JIT here resolves the crash without touching the global php.ini.
opcache.jit=off
opcache.jit_buffer_size=0
